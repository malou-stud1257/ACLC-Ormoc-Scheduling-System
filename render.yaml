services:
  - type: web
    name: campus-room-scheduler-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build --workspace client
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://localhost
